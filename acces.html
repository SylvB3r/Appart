<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès Sécurisé - Gestion Locative</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; max-width: 380px; width: 100%; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .error { color: #dc2626; font-size: 0.85rem; display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Espace Privé</h2>
        <p>Veuillez saisir votre mot de passe d'accès :</p>
        <input type="password" id="password" placeholder="Mot de passe">
        <button onclick="login()">Se connecter</button>
        <p id="error-msg" class="error">Mot de passe incorrect.</p>
    </div>

    <script>
        // Hashes autorisés pour A5179B (Majuscules) et a5179b (Minuscules)
        const VALID_HASHES = [
            "c7e3f899e691ec55239a04a3bb50ec6ad29ec4938ea5f7c32bf8168e36ed42ca", // A5179B
            "b6ad1a9faeef1e68ae8593414ec31dbcc8ca931e97d195c65f9a6568dd26806a"  // a5179b
        ];

        async function hashPassword(pwd) {
            const encoder = new TextEncoder();
            const data = encoder.encode(pwd);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function login() {
            const input = document.getElementById('password').value.trim();
            const inputHash = await hashPassword(input);
            const urlParams = new URLSearchParams(window.location.search);
            
            // Récupère la destination via redirect ou target
            const destination = urlParams.get('redirect') || urlParams.get('target');

            if (VALID_HASHES.includes(inputHash)) {
                // On enregistre toujours le hash principal
                sessionStorage.setItem('auth_token', "c7e3f899e691ec55239a04a3bb50ec6ad29ec4938ea5f7c32bf8168e36ed42ca");
                sessionStorage.setItem('auth_time', Date.now());

                // Redirection selon la destination demandée
                if (destination === 'edl' || destination === 'etat-des-lieux.html') {
                    window.location.href = 'etat-des-lieux.html';
                } else {
                    window.location.href = 'admin.html';
                }
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
