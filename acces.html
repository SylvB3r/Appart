<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès Sécurisé</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; max-width: 350px; width: 100%; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .error { color: red; font-size: 0.85rem; display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Accès Sécurisé</h2>
        <p>Entrez le mot de passe bailleur :</p>
        <input type="password" id="password" placeholder="Mot de passe">
        <button onclick="login()">Se connecter</button>
        <p id="error-msg" class="error">Mot de passe incorrect.</p>
    </div>

    <script>
        const HASH_CORRECT = "852dc8b9ff692a7e7164ff03ebcfecb3133379963c46e3ddc6bcae8d386d4eb5";

        async function hashPassword(pwd) {
            const encoder = new TextEncoder();
            const data = encoder.encode(pwd);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function login() {
            const input = document.getElementById('password').value;
            const inputHash = await hashPassword(input);

            if (inputHash === HASH_CORRECT) {
                sessionStorage.setItem('authenticated', 'true');
                const redirect = new URLSearchParams(window.location.search).get('redirect') || 'admin.html';
                window.location.href = redirect;
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
